name: Actualizar datos FCF

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Actualizar FCF
        run: |
          python scripts/sync_fcf.py

      - name: Guardar cambios
        run: |
          git config user.name "FCF Bot"
          git config user.email "actions@github.com"

          git add data/fcf.json

          git diff --cached --quiet || git commit -m "Actualización automática FCF"

          git push
