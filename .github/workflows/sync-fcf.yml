name: Sincronización C.F. Vilamajor

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests beautifulsoup4
      - name: Validar el parser deportivo
        run: python -m unittest discover -s tests -v
      - name: Sincronizar calendario, resultados, clasificación y plantilla
        run: python scripts/sync_club_data.py
      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/club.json
          if git diff --cached --quiet; then
            echo "No hay cambios de datos para guardar."
          else
            git commit -m "Actualizar datos deportivos automáticamente"
            git push
          fi
